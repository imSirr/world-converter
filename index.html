<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server to Singleplayer World Converter</title>
<style>
  :root{
    --bg:#1b1f23; --panel:#23272e; --panel2:#2b3038; --line:#39414c;
    --txt:#e8ebef; --mut:#9aa4b2; --acc:#4caf50; --acc2:#3d8b40; --err:#e0564c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.55 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 64px}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
  .drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:34px 18px;text-align:center;
    cursor:pointer;transition:.15s;background:var(--panel2)}
  .drop:hover,.drop.hot{border-color:var(--acc);background:#2c3a2d}
  .drop b{color:var(--acc)}
  .small{font-size:13px;color:var(--mut)}
  label{display:block;font-weight:600;margin:14px 0 6px}
  select,input[type=text]{width:100%;padding:9px 10px;background:var(--panel2);color:var(--txt);
    border:1px solid var(--line);border-radius:8px;font-size:14px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>div{flex:1 1 220px}
  button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:9px;background:var(--acc);
    color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  button:hover{background:var(--acc2)} button:disabled{background:#3a4048;color:#7c8694;cursor:not-allowed}
  #panel{display:none}
  .kv{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px}
  .pill b{color:var(--acc)}
  #status{margin-top:14px;font-size:14px;min-height:20px}
  #log{margin-top:8px;font-size:12.5px;color:var(--mut);white-space:pre-wrap;
    max-height:160px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
  .ok{color:var(--acc)} .er{color:var(--err)}
  .foot{margin-top:26px;font-size:12.5px;color:var(--mut);text-align:center}
  code{background:#11151a;padding:1px 5px;border-radius:5px}
  .cb{font-weight:400;font-size:13px;margin-top:6px}
  .cb input{width:auto;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <h1>Server to Singleplayer World Converter</h1>
  <p class="sub">Turn a Paper/Spigot/Bukkit server world into a ready-to-play singleplayer world,
  entirely in your browser. Nothing is uploaded.</p>

  <div class="card">
    <label for="zipInput" id="drop" class="drop">
      <p style="margin:0 0 6px">Drop your world <b>.zip</b> here, or click to choose</p>
      <p class="small">Zip the folder that contains <code>level.dat</code>. Old worlds: include
      <code>world_nether</code> and <code>world_the_end</code> too.</p>
    </label>
    <input id="zipInput" type="file" accept=".zip" hidden>
  </div>

  <div id="panel" class="card">
    <div class="kv">
      <span class="pill">Format: <b id="pf-era"></b></span>
      <span class="pill">Minecraft: <b id="pf-mc"></b></span>
      <span class="pill" id="pf-chunks"></span>
    </div>

    <div class="row">
      <div>
        <label>Player (whose inventory to keep)</label>
        <select id="player"></select>
        <label class="cb"><input type="checkbox" id="online" checked>Look up names online</label>
        <p class="small" id="nameHint"></p>
      </div>
      <div>
        <label>World format</label>
        <select id="fmt"></select>
      </div>
    </div>

    <label>Singleplayer world name</label>
    <input id="wname" type="text">

    <button id="go">Convert &amp; Download</button>
    <div id="status"></div>
    <div id="log"></div>
  </div>

  <p class="foot">Unzip the result into <code>.minecraft/saves</code> and it appears in your singleplayer list.</p>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const td=new TextDecoder();
  const state={files:null,usercache:null,info:null};
  const nameCache={};
  let busy=false;

  function log(m,cls){const d=document.createElement("div");if(cls)d.className=cls;d.textContent=m;$("log").appendChild(d);$("log").scrollTop=1e9;}
  function status(m,cls){const s=$("status");s.className=cls||"";s.textContent=m;}
  const short=u=>u.replace(/-/g,"").slice(0,8);
  const uuidVer=u=>u.replace(/-/g,"")[12];
  function markOption(uuid,text){const sel=$("player");for(const o of sel.options)if(o.value===uuid)o.textContent=text;}
  async function resolveOnline(uuid){
    const dl=uuid.replace(/-/g,"");
    const get=async(url,pick)=>{try{const r=await fetch(url,{headers:{Accept:"application/json"}});if(!r.ok)return null;return pick(await r.json())||null;}catch(e){return null;}};
    return await get("https://playerdb.co/api/player/minecraft/"+uuid, j=>j&&j.data&&j.data.player&&j.data.player.username)
        || await get("https://crafthead.net/profile/"+dl,            j=>j&&j.name)
        || await get("https://api.ashcon.app/mojang/v2/user/"+dl,     j=>j&&j.username);
  }
  async function kickOnline(players){
    if(!$("online").checked||!players)return;
    for(const p of players){
      if(p.name||nameCache[p.uuid])continue;
      if(uuidVer(p.uuid)!=="4"){markOption(p.uuid,"Offline player ("+short(p.uuid)+") - needs usercache.json");continue;}
      markOption(p.uuid,"Looking up "+short(p.uuid)+" ...");
      const n=await resolveOnline(p.uuid);
      if(n){nameCache[p.uuid]=n;markOption(p.uuid,n);}
      else markOption(p.uuid,"Unknown player ("+short(p.uuid)+")");
    }
  }

  const drop=$("drop"),zi=$("zipInput");
  zi.onchange=e=>{if(e.target.files[0])loadZip(e.target.files[0]);};
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("hot");}));
  ["dragleave","dragend"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("hot");}));
  drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("hot");const f=e.dataTransfer.files[0];if(f)loadZip(f);});
  $("online").onchange=()=>{if(state.info)kickOnline(state.info.players);};

  async function loadZip(file){
    if(busy)return;busy=true;$("log").textContent="";status("Reading "+file.name+" ...");
    try{
      const zin=await WC.JSZip.loadAsync(file);
      const files={};const ents=Object.values(zin.files).filter(f=>!f.dir);
      for(const f of ents)files[f.name]=await f.async("uint8array");
      state.files=files;log("Read "+ents.length+" files from "+file.name+".","ok");
      state.usercache=null;
      const k=Object.keys(files).find(p=>/(^|\/)usercache\.json$/i.test(p));
      if(k){state.usercache=td.decode(files[k]);log("Found usercache.json inside the upload - using it for names.","ok");}
      await refresh();
    }catch(e){status("Could not read the zip: "+e.message,"er");}
    busy=false;
  }

  async function refresh(){
    if(!state.files)return;
    try{
      const info=await WC.analyzeWorld(state.files,state.usercache);state.info=info;
      $("pf-era").textContent = info.era==="new" ? "New (26.1+)" : "Old (pre-26.1)";
      $("pf-mc").textContent = info.mcVersion || "unknown";
      const mca=Object.keys(state.files).filter(p=>p.endsWith(".mca")).length;
      $("pf-chunks").innerHTML="Region files: <b>"+mca+"</b>";

      const fmt=$("fmt");fmt.innerHTML="";
      [["","Auto ("+(info.era==="new"?"New":"Old")+")"],["new","New (26.1+)"],["old","Old (pre-26.1)"]]
        .forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;fmt.appendChild(o);});

      const sel=$("player");sel.innerHTML="";
      const fresh=document.createElement("option");fresh.value="__fresh__";fresh.textContent="Fresh start - no player data";sel.appendChild(fresh);
      info.players.forEach(p=>{const o=document.createElement("option");o.value=p.uuid;
        const known=p.name||nameCache[p.uuid];
        o.textContent=known?known:("Unknown player ("+short(p.uuid)+")");sel.appendChild(o);});
      sel.value = info.players.length ? info.players[0].uuid : "__fresh__";
      $("nameHint").textContent = info.players.length ? "" : "No player data found in this world.";
      kickOnline(info.players);

      $("wname").value = (info.levelName||"world");
      $("panel").style.display="block";status("Loaded. Review options and convert.","ok");
    }catch(e){status("Error: "+e.message,"er");$("panel").style.display="none";}
  }

  $("go").onclick=async()=>{
    if(busy||!state.files)return;busy=true;$("go").disabled=true;
    try{
      const pv=$("player").value, mode=pv==="__fresh__"?"fresh":"player";
      const eraOverride=$("fmt").value||undefined;
      status("Converting ... (large worlds take a moment)");
      const R=await WC.convertWorld(state.files,{mode,playerUuid:mode==="player"?pv:undefined,
        levelName:$("wname").value,usercacheJson:state.usercache,eraOverride});
      const zout=new WC.JSZip();
      for(const[p,b]of Object.entries(R.files))zout.file(p,b);
      const blob=await zout.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:6}});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=R.outName+".zip";
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      log("Wrote "+Object.keys(R.files).length+" files.","ok");
      status("Done - downloaded \""+R.outName+".zip\". Unzip it into your saves folder.","ok");
    }catch(e){status("Conversion failed: "+e.message,"er");log(String(e&&e.stack||e),"er");}
    busy=false;$("go").disabled=false;
  };
})();
</script>
